{% extends "admin/base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1 class="page-title">AI settings</h1>
<p class="muted">Extra system instructions — har chat me AI ko milengi.</p>
<form class="form" method="post" action="{{ url_for('admin.settings_save') }}">
  <label>Extra system prompt</label>
  <textarea name="extra_system_prompt" rows="14">{{ extra_system_prompt }}</textarea>
  <button type="submit" class="btn">Save settings</button>
</form>
{% endblock %}
